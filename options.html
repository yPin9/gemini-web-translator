<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>雙語翻譯 — 設定</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f8f9fa; color: #202124; margin: 0; }
    .card { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #5f6368; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 18px 0 6px; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px; border: 1px solid #dadce0; border-radius: 8px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .actions { margin-top: 24px; display: flex; gap: 10px; align-items: center; }
    button { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    #save { background: #4285f4; color: #fff; }
    #test { background: #f1f3f4; color: #202124; }
    #status { font-size: 13px; }
    .ok { color: #188038; }
    .err { color: #c5221f; }
    .help { background: #e8f0fe; border-radius: 8px; padding: 14px 16px; font-size: 13px; line-height: 1.6; margin-top: 24px; }
    .help a { color: #1a73e8; }
    code { background: #f1f3f4; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>雙語翻譯 (Gemini) 設定</h1>
    <p class="sub">翻譯後保留原文，並在下方顯示譯文。</p>

    <label for="apiKey">Gemini API Key</label>
    <input id="apiKey" type="password" placeholder="貼上你的 API key" autocomplete="off" />

    <div class="row">
      <div>
        <label for="model">模型</label>
        <select id="model">
          <option value="gemini-flash-lite-latest">gemini-flash-lite-latest（推薦，永遠指向最新 lite，最省）</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite（最省最快）</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash（品質更好）</option>
          <option value="gemini-flash-latest">gemini-flash-latest（永遠指向最新 flash）</option>
        </select>
      </div>
      <div>
        <label for="targetLang">目標語言</label>
        <input id="targetLang" type="text" value="繁體中文" />
      </div>
    </div>

    <div class="actions">
      <button id="save">儲存</button>
      <button id="test">測試連線</button>
      <span id="status"></span>
    </div>

    <div class="help">
      <b>還沒有 API key？</b> 免費申請步驟：<br />
      1. 前往 <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio → API keys</a>（用 Google 帳號登入）<br />
      2. 點 <code>Create API key</code>，複製產生的金鑰<br />
      3. 貼到上面欄位，按「儲存」→「測試連線」<br />
      金鑰只存在你本機瀏覽器 (<code>chrome.storage.local</code>)，不會上傳。
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
