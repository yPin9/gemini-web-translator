<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 240px; margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; }
    .wrap { padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    button {
      width: 100%; padding: 10px; margin-bottom: 8px; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer;
    }
    #toggle { background: #4285f4; color: #fff; }
    #toggle:hover { background: #3b78e7; }
    #restore { background: #f1f3f4; color: #202124; }
    #restore:hover { background: #e5e7ea; }
    .hint { font-size: 12px; color: #5f6368; margin: 8px 0 0; line-height: 1.5; }
    a { color: #1a73e8; cursor: pointer; }
    #warn { display: none; background: #fce8e6; color: #c5221f; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>雙語翻譯 (Gemini)</h1>
    <div id="warn">尚未設定 API key，請先開啟<a id="warnLink">選項</a>。</div>
    <button id="toggle">翻譯此頁</button>
    <button id="restore">還原原文</button>
    <p class="hint">
      快捷鍵：<b>Alt+T</b><br />
      <a id="openOptions">開啟選項設定</a>
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
